---
name: Pull Request
on: pull_request

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: extractions/setup-just@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/checkout@v7

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: 5.1

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install Lua test dependencies
        run: luarocks install busted

      - name: Install validation dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Run Luacheck
        id: luacheck
        uses: nebularg/actions-luacheck@v1
        continue-on-error: true
        with:
          args: --no-color -q
          files: $(git ls-files '*.lua' ':!:totalRP3/Libs/Ellyb/Libraries/*' ':!:totalRP3/Libs/TaintLess/*' ':!:totalRP3/Locales/????.lua')
          annotate: warning

      - name: Run editorconfig-checker
        id: editorconfig
        uses: wow-rp-addons/actions-editorconfig-check@v1.0.2
        continue-on-error: true
        with:
          args: -no-color
          files: $(git ls-files '*.lua' '*.sh' '*.xml' ':!:totalRP3/Libs/Ellyb/Libraries/*' ':!:totalRP3/Libs/TaintLess/*' ':!:totalRP3/Locales/????.lua')

      - name: Run XML schema validation
        id: validate_xml
        continue-on-error: true
        run: python .github/scripts/validate_xml.py $(git ls-files '*.xml' ':!:totalRP3/Bindings.xml')

      - name: Check lint results
        if: steps.luacheck.outcome == 'failure' || steps.editorconfig.outcome == 'failure' || steps.validate_xml.outcome == 'failure'
        run: |
          echo "Luacheck: ${{ steps.luacheck.outcome }}"
          echo "editorconfig-checker: ${{ steps.editorconfig.outcome }}"
          echo "XML validation: ${{ steps.validate_xml.outcome }}"
          exit 1

      - name: Run Lua tests
        run: just test

      # Fetched at run time (not from the event payload) so that re-running
      # the workflow after adding the label picks it up.
      - name: Check for package label
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --paginate --jq '.[].name' | grep -qx package; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Package
        if: steps.labels.outputs.package == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -dz

      - name: Upload Artifact
        if: steps.labels.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: totalRP3-PR-${{ github.event.number }}
          path: .release/
          archive: true
          include-hidden-files: true

      - name: Send Webhook Notification
        if: failure()
        uses: ./.github/actions/send-webhook-notification
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
